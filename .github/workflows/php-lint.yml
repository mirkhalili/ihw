name: PHP Lint
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        run: find public app bin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: CSV hardware parser smoke test
        run: php bin/smoke_csv.php
